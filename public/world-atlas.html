<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Atlas</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="site-container">
    <!-- Top Nav / Header -->
    <div id="sidebar-container"></div>

    <!-- Main Parchment Content -->
    <main class="content">
      <div class="atlas-placeholder">
        <p>The cartographers are hard at work surveying the land...</p>
        <!-- Fantasy Compass Rose SVG -->
        <svg class="compass-icon" viewBox="0 0 120 120">
          <!-- Outer Ring & Dial -->
          <circle cx="60" cy="60" r="48" fill="none" stroke="#5c1818" stroke-width="2"/>
          <circle cx="60" cy="60" r="44" fill="none" stroke="#5c1818" stroke-width="0.8" opacity="0.7"/>

          <!-- Cardinal Direction Notches -->
          <line x1="60" y1="8" x2="60" y2="14" stroke="#5c1818" stroke-width="2"/>
          <line x1="60" y1="106" x2="60" y2="112" stroke="#5c1818" stroke-width="2"/>
          <line x1="8" y1="60" x2="14" y2="60" stroke="#5c1818" stroke-width="2"/>
          <line x1="106" y1="60" x2="112" y2="60" stroke="#5c1818" stroke-width="2"/>

          <!-- Minor Star Points (Rotated 45° to NE, SE, SW, NW) -->
          <g transform="rotate(45 60 60)" opacity="0.5">
            <!-- North-East (Rotated North) -->
            <polygon points="60,60 56,60 60,26" fill="#5c1818"/>
            <polygon points="60,60 64,60 60,26" fill="#5c1818"/>

            <!-- South-West (Rotated South) -->
            <polygon points="60,60 56,60 60,94" fill="#5c1818"/>
            <polygon points="60,60 64,60 60,94" fill="#5c1818"/>

            <!-- North-West (Rotated West) -->
            <polygon points="60,60 60,56 26,60" fill="#5c1818"/>
            <polygon points="60,60 60,64 26,60" fill="#5c1818"/>

            <!-- South-East (Rotated East) -->
            <polygon points="60,60 60,56 94,60" fill="#5c1818"/>
            <polygon points="60,60 60,64 94,60" fill="#5c1818"/>
          </g>

          <!-- Major Star Points (North, South, East, West) -->
          <!-- North Point -->
          <polygon points="60,60 53,60 60,14" fill="#5c1818"/>
          <polygon points="60,60 67,60 60,14" fill="#5c1818"/>

          <!-- South Point -->
          <polygon points="60,60 53,60 60,106" fill="#5c1818"/>
          <polygon points="60,60 67,60 60,106" fill="#5c1818"/>

          <!-- West Point -->
          <polygon points="60,60 60,53 14,60" fill="#5c1818"/>
          <polygon points="60,60 60,67 14,60" fill="#5c1818"/>

          <!-- East Point -->
          <polygon points="60,60 60,53 106,60" fill="#5c1818"/>
          <polygon points="60,60 60,67 106,60" fill="#5c1818"/>

          <!-- Center Pivot -->
          <circle cx="60" cy="60" r="5" fill="#f4ead5" stroke="#5c1818" stroke-width="2"/>
          <circle cx="60" cy="60" r="2" fill="#5c1818"/>
        </svg>
      </div>
    </main>
  </div>

  <script src="/js/loadMenu.js"></script>
</body>
